name: Build & deploy

# Runs on every push to main (and by hand from the Actions tab).
# Builds the site and uploads dist/ to the hosting via FTP.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Skipped (not failed) until the repository variable SITE_ENV is set to staging or production
    # together with the FTP secrets – see docs/go-live-plan.md.
    if: ${{ vars.SITE_ENV == 'staging' || vars.SITE_ENV == 'production' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the sitemap gets real <lastmod> dates

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Repository variable SITE_ENV (Settings → Secrets and variables → Actions → Variables):
      #   staging     → every page noindex, robots.txt blocks crawlers (use while FTP_DIR points to staging)
      #   production  → indexable; set this together with FTP_DIR = live folder at go-live
      - name: Build
        run: node build.mjs
        env:
          SITE_ENV: ${{ vars.SITE_ENV }}

      # Repository secrets (Settings → Secrets and variables → Actions):
      #   FTP_SERVER    ftp.horseandmind.ch (unaxus.ch, cPanel)
      #   FTP_USERNAME  cPanel FTP account incl. @horseandmind.ch, its directory = target folder
      #   FTP_PASSWORD
      #   FTP_DIR       ./ (relative to the FTP account's directory, ending in /); ./new/ during go-live step 2
      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          local-dir: ./dist/
          protocol: ftps
          # Only uploads files that changed since the last deploy.
          # Never deletes anything else on the server (e.g. the old WordPress) unless you set dangerous-clean-slate.

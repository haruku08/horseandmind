name: Build & deploy

# Runs on every push to main (and by hand from the Actions tab).
# Builds the site and uploads dist/ to the hosting via FTP.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the sitemap gets real <lastmod> dates

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Repository variable SITE_ENV (Settings → Secrets and variables → Actions → Variables):
      #   staging     → every page noindex, robots.txt blocks crawlers (use while FTP_DIR points to staging)
      #   production  → indexable; set this together with FTP_DIR = live folder at go-live
      - name: Check SITE_ENV
        run: |
          case "${{ vars.SITE_ENV }}" in
            staging|production) echo "Building for ${{ vars.SITE_ENV }}" ;;
            *) echo "::error::Set the repository variable SITE_ENV to 'staging' or 'production' first."; exit 1 ;;
          esac

      - name: Build
        run: node build.mjs
        env:
          SITE_ENV: ${{ vars.SITE_ENV }}

      # Repository secrets (Settings → Secrets and variables → Actions):
      #   FTP_SERVER    e.g. ftp.horseandmind.ch
      #   FTP_USERNAME
      #   FTP_PASSWORD
      #   FTP_DIR       target folder ending in /, e.g. /staging/ first, later /public_html/ or /httpdocs/
      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          local-dir: ./dist/
          protocol: ftps
          # Only uploads files that changed since the last deploy.
          # Never deletes anything else on the server (e.g. the old WordPress) unless you set dangerous-clean-slate.

name: Staging (GitHub Pages)

# Builds the staging version (noindex, robots blocked, demo booking + CRM) and publishes it
# on GitHub Pages under https://<owner>.github.io/<repo>/.
# Setup (done 13 Nov 2026): repo public, Settings → Pages → Source: "GitHub Actions".
# GitHub only lets the default branch deploy to Pages, so the preview updates when main changes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the sitemap gets real <lastmod> dates

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build staging version
        run: node build.mjs
        env:
          SITE_ENV: staging
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

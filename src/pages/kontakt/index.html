<!--meta {"title": "Kontakt | Horse & Mind Winterthur", "description": "Kontakt zu Horse & Mind – Manuela Pattynama, Winterthur. Schreib uns oder buche direkt ein Erstgespräch.", "nav": "ueber"} -->
<section class="section" style="padding-top: 72px">
  <div class="wrap">
    <div class="form-layout">
      <div class="split-text">
        <p class="kicker">Kontakt</p>
        <h1 class="headline">Schreib mir.</h1>
        <p class="subhead">Fragen zu einem Angebot? Ich melde mich so bald wie möglich.</p>
        <dl class="specs" style="margin-top: 16px">
          <div><dt>E-Mail</dt><dd>info@horseandmind.ch</dd></div>
          <div><dt>Telefon</dt><dd>+41 76 507 78 37</dd></div>
          <div><dt>Adresse</dt><dd>Hegifeldstrasse 6B, 8404 Winterthur</dd></div>
        </dl>
        <p><a class="more" href="/termin/">Lieber direkt einen Termin buchen</a></p>
      </div>
      <form class="form" data-booking-form data-kind="contact" novalidate>
      <input type="hidden" name="source" value="web:kontakt">
      <div class="hp" aria-hidden="true"><label>Firma<input type="text" name="company" tabindex="-1" autocomplete="off"></label></div>
      <div class="row-2">
        <label class="field">Vorname<input type="text" name="firstName" autocomplete="given-name" required></label>
        <label class="field">Nachname<input type="text" name="lastName" autocomplete="family-name" required></label>
      </div>
      <label class="field">E-Mail<input type="email" name="email" autocomplete="email" required></label>
      <label class="field">Mobile <span class="hint">(optional)</span><input type="tel" name="phone" autocomplete="tel" placeholder="+41"></label>
      <label class="field">Interesse an
        <select name="interest">
          <option value="">Bitte wählen</option>
          <option value="coaching">Coaching für Erwachsene</option>
          <option value="kids">Begleitung für Kinder</option>
          <option value="camp">Kids Camp</option>
          <option value="reitpaedagogik">Reitpädagogik</option>
          <option value="wingwave">Wingwave</option>
          <option value="epigenetik">Epigenetik</option>
          <option value="anderes">Etwas anderes</option>
        </select>
      </label>
      <label class="field">Nachricht<textarea name="message" rows="5" required></textarea></label>
      <div class="consent">
        <label class="check"><input type="checkbox" name="privacy" required><span>Ich habe die <a href="/datenschutz/" target="_blank">Datenschutzerklärung</a> gelesen und bin einverstanden, dass meine Angaben zur Beantwortung meiner Anfrage gespeichert werden.</span></label>
      </div>
      <div class="form-status" data-form-status role="status" hidden></div>
      <button class="btn" type="submit" style="min-height:54px; font-size:17px">Nachricht senden</button>
    </form>
    </div>
  </div>
</section>
